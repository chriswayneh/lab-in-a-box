# =============================================================================
# Platform — Gitea, MinIO
# =============================================================================
# Where code and artifacts live. Both are provisioned on first boot: Gitea gets
# an administrator, MinIO gets its buckets, policies and lifecycle rules.
# =============================================================================

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  environment:
    TZ: ${LAB_TZ:-UTC}

x-hardened: &hardened
  security_opt:
    - no-new-privileges:true

x-init-job: &init-job
  restart: "no"
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "2"

services:

  # ---------------------------------------------------------------------------
  # Gitea — Git hosting
  #
  # Configured entirely through GITEA__section__KEY environment variables,
  # which the image expands into app.ini on start. That keeps the whole
  # configuration visible here rather than split across a mounted ini file.
  # ---------------------------------------------------------------------------
  gitea:
    <<: [*defaults, *hardened]
    image: gitea/gitea:1.23
    container_name: ${COMPOSE_PROJECT_NAME:-lab}-gitea
    environment:
      TZ: ${LAB_TZ:-UTC}
      USER_UID: "1000"
      USER_GID: "1000"

      # --- Database ---------------------------------------------------------
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: ${GITEA_DB_PASSWORD:-gitea-insecure-dev-only}
      GITEA__database__SSL_MODE: disable

      # --- Server -----------------------------------------------------------
      GITEA__server__DOMAIN: git.${LAB_DOMAIN:-lab.localhost}
      GITEA__server__ROOT_URL: https://git.${LAB_DOMAIN:-lab.localhost}/
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__SSH_DOMAIN: git.${LAB_DOMAIN:-lab.localhost}
      # The port advertised in clone URLs must be the *host* port, not the
      # container's, or every `git clone ssh://` the UI suggests will fail.
      GITEA__server__SSH_PORT: ${GITEA_SSH_PORT:-2222}
      GITEA__server__SSH_LISTEN_PORT: "22"
      GITEA__server__START_SSH_SERVER: "true"
      GITEA__server__OFFLINE_MODE: "true"
      GITEA__server__LFS_START_SERVER: "true"

      # --- Access control ---------------------------------------------------
      # Skips the web installer; the administrator is created by gitea-init.
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "false"
      GITEA__service__ENABLE_NOTIFY_MAIL: "false"
      GITEA__service__DEFAULT_KEEP_EMAIL_PRIVATE: "true"
      GITEA__service__DEFAULT_ALLOW_CREATE_ORGANIZATION: "true"
      GITEA__repository__DEFAULT_PRIVATE: private
      GITEA__repository__DISABLE_HTTP_GIT: "false"

      # --- Sessions and cache ----------------------------------------------
      # Reuses the lab's Redis rather than Gitea's in-process cache, so a
      # restart does not sign everyone out.
      GITEA__cache__ENABLED: "true"
      GITEA__cache__ADAPTER: redis
      GITEA__cache__HOST: redis://:${REDIS_PASSWORD:-redis-insecure-dev-only}@redis:6379/0?pool_size=100&idle_timeout=180s
      GITEA__session__PROVIDER: redis
      GITEA__session__PROVIDER_CONFIG: redis://:${REDIS_PASSWORD:-redis-insecure-dev-only}@redis:6379/1
      GITEA__session__COOKIE_SECURE: "true"

      # --- Actions ----------------------------------------------------------
      # Gitea's built-in CI. Enabled so the UI is there, but no runner is
      # registered — a runner needs the Docker socket, and the lab does not
      # hand that out without asking. Register one with `gitea actions
      # generate-runner-token` and the act_runner image when you want CI.
      GITEA__actions__ENABLED: "true"

      # --- Logging ----------------------------------------------------------
      GITEA__log__LEVEL: Warn
      GITEA__log__MODE: console
    volumes:
      - gitea_data:/data
      # Gitea signs commits and validates SSH host keys against the host clock;
      # a drifting container clock produces confusing signature failures.
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - lab_edge
      - lab_data
    ports:
      # SSH cannot be routed by Traefik, which speaks HTTP. This is the one
      # service that needs a second host port.
      - "${GITEA_SSH_PORT:-2222}:22"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.docker.network=${COMPOSE_PROJECT_NAME:-lab}_edge
      - traefik.http.routers.gitea.rule=Host(`git.${LAB_DOMAIN:-lab.localhost}`)
      - traefik.http.routers.gitea.entrypoints=web,websecure
      - traefik.http.routers.gitea.tls=true
      - traefik.http.routers.gitea.middlewares=lab-default@file,lab-ratelimit@docker
      - traefik.http.services.gitea.loadbalancer.server.port=3000

  # ---------------------------------------------------------------------------
  # Gitea provisioning — creates the first administrator
  # ---------------------------------------------------------------------------
  gitea-init:
    <<: *init-job
    image: gitea/gitea:1.23
    container_name: ${COMPOSE_PROJECT_NAME:-lab}-gitea-init
    # Must match USER_UID/USER_GID above, or the CLI cannot read app.ini.
    user: "1000:1000"
    entrypoint: ["/bin/sh", "/scripts/init-gitea.sh"]
    environment:
      TZ: ${LAB_TZ:-UTC}
      GITEA_WORK_DIR: /data/gitea
      GITEA_APP_INI: /data/gitea/conf/app.ini
      GITEA_ADMIN_USER: ${GITEA_ADMIN_USER:-labadmin}
      GITEA_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD:-gitea-insecure-dev-only}
      GITEA_ADMIN_EMAIL: ${GITEA_ADMIN_EMAIL:-labadmin@lab.example.com}
      LAB_DOMAIN: ${LAB_DOMAIN:-lab.localhost}
    volumes:
      - gitea_data:/data
      - ./scripts/init-gitea.sh:/scripts/init-gitea.sh:ro
    networks:
      # `gitea admin user create` writes to PostgreSQL directly rather than
      # calling the API, so this job needs the data network, not the edge.
      - lab_data
    depends_on:
      gitea:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage
  #
  # Two routes: the console for humans at minio.${LAB_DOMAIN}, and the S3 API
  # for tooling at s3.${LAB_DOMAIN}. They are different ports on the same
  # container, and conflating them is the most common MinIO misconfiguration.
  # ---------------------------------------------------------------------------
  minio:
    <<: [*defaults, *hardened]
    # MinIO publishes date-stamped release tags rather than semantic versions,
    # so there is no stable minor tag to track. Renovate or Dependabot will
    # propose a digest pin; see docs/security.md on supply chain.
    image: minio/minio:latest
    container_name: ${COMPOSE_PROJECT_NAME:-lab}-minio
    command: server /data --console-address ":9001"
    environment:
      TZ: ${LAB_TZ:-UTC}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-labadmin}
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      # The console issues browser redirects; without this it sends users to
      # the internal container hostname after login.
      MINIO_BROWSER_REDIRECT_URL: https://minio.${LAB_DOMAIN:-lab.localhost}
      MINIO_SERVER_URL: https://s3.${LAB_DOMAIN:-lab.localhost}
      # Lets Prometheus scrape cluster metrics without minting a signed JWT,
      # which it cannot do from a static configuration file. The endpoint is
      # reachable only from inside the lab's networks.
      MINIO_PROMETHEUS_AUTH_TYPE: public
      MINIO_UPDATE: "off"
    secrets:
      - minio_root_password
    volumes:
      - minio_data:/data
    networks:
      - lab_edge
      - lab_observability
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.docker.network=${COMPOSE_PROJECT_NAME:-lab}_edge

      # --- Console (humans) --------------------------------------------------
      - traefik.http.routers.minio-console.rule=Host(`minio.${LAB_DOMAIN:-lab.localhost}`)
      - traefik.http.routers.minio-console.entrypoints=web,websecure
      - traefik.http.routers.minio-console.tls=true
      - traefik.http.routers.minio-console.service=minio-console
      - traefik.http.routers.minio-console.middlewares=lab-default@file,lab-ratelimit@docker
      - traefik.http.services.minio-console.loadbalancer.server.port=9001

      # --- S3 API (tooling) --------------------------------------------------
      # No compression: S3 payloads are usually already compressed, and
      # rewriting the body breaks signature validation on some clients.
      - traefik.http.routers.minio-api.rule=Host(`s3.${LAB_DOMAIN:-lab.localhost}`)
      - traefik.http.routers.minio-api.entrypoints=web,websecure
      - traefik.http.routers.minio-api.tls=true
      - traefik.http.routers.minio-api.service=minio-api
      - traefik.http.routers.minio-api.middlewares=lab-security-headers@file
      - traefik.http.services.minio-api.loadbalancer.server.port=9000

  # ---------------------------------------------------------------------------
  # MinIO provisioning — buckets, policies, lifecycle rules
  # ---------------------------------------------------------------------------
  minio-init:
    <<: *init-job
    image: minio/mc:latest
    container_name: ${COMPOSE_PROJECT_NAME:-lab}-minio-init
    entrypoint: ["/bin/sh", "/scripts/init-minio.sh"]
    environment:
      TZ: ${LAB_TZ:-UTC}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-labadmin}
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      MINIO_DEFAULT_BUCKETS: ${MINIO_DEFAULT_BUCKETS:-lab-artifacts,lab-backups,lab-datasets,loki-chunks}
      LAB_DOMAIN: ${LAB_DOMAIN:-lab.localhost}
    secrets:
      - minio_root_password
    volumes:
      - ./scripts/init-minio.sh:/scripts/init-minio.sh:ro
    networks:
      - lab_edge
    depends_on:
      minio:
        condition: service_healthy
