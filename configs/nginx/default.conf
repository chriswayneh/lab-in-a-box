# =============================================================================
# Lab-in-a-Box landing page + health endpoint
# =============================================================================
# Served by nginxinc/nginx-unprivileged, which runs as UID 101 and therefore
# cannot bind ports below 1024 — hence 8080 rather than 80.
# =============================================================================

server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Do not advertise the exact nginx version in error pages / headers.
    server_tokens off;

    charset utf-8;

    # -------------------------------------------------------------------------
    # Health endpoint
    #
    # Returns 200 with a small JSON body. Consumed by the container healthcheck,
    # by `make health`, and by the status probes on the landing page.
    # -------------------------------------------------------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type application/json always;
        # Allow the landing page to read this cross-origin so the status dots
        # can distinguish "reachable" from "blocked by CORS".
        add_header Access-Control-Allow-Origin * always;
        return 200 '{"status":"ok","service":"lab-landing"}';
    }

    # Kubernetes-style alias, so the same probe path works if this lab is
    # later lifted into the Kubernetes edition on the roadmap.
    location = /livez {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain always;
    }

    location / {
        try_files $uri $uri/ =404;

        # The page is static and rebuilt on every deploy — never cache the shell.
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }

    location ~* \.(svg|png|ico|woff2)$ {
        expires 7d;
        access_log off;
    }

    error_page 404 /index.html;
}
