# =============================================================================
# Redis — cache and session store
# =============================================================================
# Everything that does not need a value from .env lives here. The password is
# still passed as a command-line flag in compose, because it does need one and
# Redis lets later flags override this file.
#
# Why a file at all: `rename-command X ""` takes two arguments, the second an
# empty string. Expressed as compose command arguments, the empty string either
# collapses or arrives quoted, and Redis rejects the resulting directive with
# "Bad directive or wrong number of arguments". A config file has no such
# ambiguity.
# =============================================================================

# -----------------------------------------------------------------------------
# Persistence
#
# AOF rather than RDB snapshots: sessions and cache entries are cheap to lose
# in bulk but annoying to lose silently, and AOF's per-second fsync is a better
# fit than a snapshot every few minutes.
# -----------------------------------------------------------------------------
appendonly yes
appendfsync everysec

# -----------------------------------------------------------------------------
# Memory
#
# A hard cap matters on a laptop running twenty other containers. `allkeys-lru`
# means Redis evicts under pressure instead of returning errors — this is a
# cache, and a full cache should degrade rather than fail.
# -----------------------------------------------------------------------------
maxmemory 256mb
maxmemory-policy allkeys-lru

# -----------------------------------------------------------------------------
# Disabled commands
#
# Renaming to an empty string removes a command entirely. Both of these wipe
# data instantly with no confirmation and nothing in this lab has any reason to
# call them.
#
# CONFIG is deliberately left enabled. It is already gated behind requirepass,
# and client libraries legitimately call `CONFIG GET` on connect — disabling it
# breaks working clients to defend against an attacker who, by definition,
# already has the password.
# -----------------------------------------------------------------------------
rename-command FLUSHALL ""
rename-command FLUSHDB ""

# -----------------------------------------------------------------------------
# Logging
#
# Redis is scraped and shipped like everything else, so keep it to warnings.
# -----------------------------------------------------------------------------
loglevel notice
