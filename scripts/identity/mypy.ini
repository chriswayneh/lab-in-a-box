# =============================================================================
# Type checking for the identity engine
# =============================================================================
# Run through scripts/check-python.sh, which pins the mypy version so a local
# run and a CI run agree. Config lives beside the code it checks rather than in
# a repo-root pyproject.toml, because this is the only Python in the project
# and a root-level config would imply otherwise.
#
# Deliberately NOT strict. The engine is standard-library-only, untyped by
# origin, and its value is in what it does to a live lab rather than in its
# type coverage. The goal here is to catch the class of error that silently
# ships -- an attribute that cannot exist, a None that is not handled, a return
# type that lies about what a function gives back -- not to reach full
# annotation coverage.
# =============================================================================

[mypy]
python_version = 3.12

# Modules are imported flat (`import rbac`), not as a package, because that is
# how the engine runs inside its container with /engine on sys.path.
explicit_package_bases = False
namespace_packages = False

# Off deliberately: almost nothing here is annotated, and turning these on
# would report every function in the codebase rather than the handful of
# genuine defects the check exists to find.
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True

# The engine has no third-party dependencies, so there are no stubs to miss.
# This keeps a missing-stub error from ever masking a real one.
ignore_missing_imports = True

warn_unused_ignores = True
warn_redundant_casts = True

# -----------------------------------------------------------------------------
# The live test harnesses are excluded.
#
# test_lifecycle.py, test_rbac.py, test_campaign.py, test_scim.py and
# test_audit.py are not library code. Each is a script with its own main() and
# its own runner, executed against a running lab by scripts/test-identity.sh.
# Their errors are almost entirely "Optional not narrowed": `doc =
# run_json(...)` returns dict|None and is then indexed, because in a harness a
# None there means the command under test failed and crashing is an acceptable
# way to find that out.
#
# Annotating around that would add noise to five files without catching a
# defect the harness would not already catch by failing loudly. The production
# modules those harnesses exercise ARE checked, which is where a type error
# would actually ship unnoticed.
#
# The one exception is the unit/ directory: those are ordinary pytest tests of
# pure functions, so they are checked like any other module.
# -----------------------------------------------------------------------------
exclude = (?x)(
    ^test_lifecycle\.py$
    | ^test_rbac\.py$
    | ^test_campaign\.py$
    | ^test_scim\.py$
    | ^test_audit\.py$
  )
