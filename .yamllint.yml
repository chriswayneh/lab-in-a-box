# =============================================================================
# yamllint
# =============================================================================
# Tuned for infrastructure YAML rather than application YAML. The rules that
# are relaxed below are relaxed for a stated reason; the rest are left strict.
# =============================================================================

extends: default

ignore: |
  .git/
  backups/
  node_modules/
  # Generated by `make docs`.
  docs/SERVICES.md

rules:
  # Compose files and Prometheus rules contain long PromQL expressions and long
  # URLs, and hard-wrapping either makes them harder to read, not easier.
  line-length:
    max: 120
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: true
    level: warning

  # `on:` is a GitHub Actions keyword, not the boolean true. Without this,
  # every workflow file fails to lint.
  truthy:
    check-keys: true
    allowed-values: ["true", "false", "on", "off"]

  # A leading `---` adds nothing to a single-document file.
  document-start: disable

  # Compose commonly indents list items under their key; both styles are
  # readable and enforcing one would mean reformatting upstream examples.
  indentation:
    spaces: 2
    indent-sequences: consistent

  comments:
    min-spaces-from-content: 1
    require-starting-space: true

  # Section-header comment blocks are separated by a blank line above; the
  # default of "must be preceded by content" flags every one of them.
  comments-indentation: disable

  braces:
    max-spaces-inside: 1
  brackets:
    max-spaces-inside: 1

  # Duplicate keys are always a bug, never a style choice.
  key-duplicates: enable

  empty-lines:
    max: 2
    max-start: 0
    max-end: 1

  # Trailing whitespace is invisible and shows up as noise in every diff.
  trailing-spaces: enable
  new-line-at-end-of-file: enable
